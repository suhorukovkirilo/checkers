<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">
    <link href="files/css/index.css" rel="stylesheet">
    <link href="files/css/faq.css" rel="stylesheet">
    <title>Checkers</title>
</head>
<body>
    {{ header }}
    <main>
        <h1 style="text-align: center; color: darkcyan">FAQ checkers</h1>
        <div class="faq">
            <input id='faq-a' type='checkbox'>
            <label for='faq-a'>
                <p class="faq-heading">What is this site for?</p>
                <div class='faq-arrow'></div>
                <p class="faq-text">It is a checkers game site. Here you can create games and play checkers with your friends</p>
            </label>
            <input id='faq-b' type='checkbox'>
            <label for='faq-b'>
                <p class="faq-heading">How to create a game?</p>
                <div class='faq-arrow'></div>
                <p class="faq-text">Firstly, you need to log in via telegram. Next, you need to go to the "New game" page and write your game nickname and send a link or a code to your friends.</p>
            </label>
            <input id='faq-c' type='checkbox'>
            <label for='faq-c'>
                <p class="faq-heading">How to change theme to dark?</p>
                <div class='faq-arrow'></div>
                <p class="faq-text">To change theme from the website you need to click on the lamp in the top left corner. Also you can click settings in the top right corner and click change theme.</p>
            </label>
            <input id='faq-d' type='checkbox'>
            <label for='faq-d'>
                <p class="faq-heading">How to stop animated background?</p>
                <div class='faq-arrow'></div>
                <p class="faq-text">To stop animated rain in the background you need to go to the settings (top right corner) and choose the background(rain) option. <p>*Returning animated background may cause page reload.</p></p>
            </label>
            <input id='faq-e' type='checkbox'>
            <label for='faq-e'>
                <p class="faq-heading">Resources and creators</p>
                <div class='faq-arrow'></div>
                <p class="faq-text">The creator of the site is suhorukov kyrylo. telegram: @ksuhoi. <a href="https://github.com/suhorukovkirilo" target="_blank">github</a> <p>*Icons from <a href="https://flaticon.com/">flaticon.com</a></p></p>
            </label>
        </div>
    </main>
    {{ background }}
</body>
</html>
