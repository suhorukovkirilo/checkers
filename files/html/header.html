<header>
    <img src="files/img/lamp.svg" width="32px" height="32px" id="theme-switch" theme="light">
    <img class="icon" src="files/img/icon.png">
    <h1>Checkers</h1>
    <nav>
        <a href="/create">New game</a>
        <a href="/join">Join game</a>
        <a href="/profile">Profile</a>
        <a href="/">Home</a>
        <a href="faq">FAQ</a>
        <img src="files/img/settings.svg" class="settings">
    </nav>
</header>
<div class="sub-header"></div>
<div class="sidebar">
    <p class="rain-settings">
        <span class="title">Rain background</span>
        <label class="switch">
            <input type="checkbox">
            <span></span>
        </label>
    </p>  
    <p class="theme-settings">
        <span class="title">Change theme</span>
        <label class="switch" style="margin-left: 10px;">
            <input type="checkbox">
            <span></span>
        </label>
    </p>  
    <p style="visibility: hidden;">
        <span class="title">Not a setting</span>
        <label class="switch" style="margin-left: 3px;">
            <input type="checkbox">
            <span></span>
        </label>
    </p>  
    <p class="data-settings">
        <span class="title">Remove all data</span>
        <label class="switch" style="margin-left: 3px;">
            <input type="checkbox">
            <span></span>
        </label>
    </p>        
</div>
<script src="files/js/theme.js"></script>
